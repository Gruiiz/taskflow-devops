name: CI/CD - TaskFlow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_aws:
        description: Implantar a versão validada no AWS ECS
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: taskflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  GHCR_IMAGE: ghcr.io/gruiiz/taskflow-api

jobs:
  qualidade-testes-seguranca:
    name: Qualidade, testes e segurança
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar ferramentas de qualidade
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verificar formatação e padrões
        run: ruff check app tests

      - name: Analisar segurança do código
        run: bandit -q -r app

      - name: Executar testes com cobertura
        run: |
          coverage run --source=app -m unittest discover -s tests -p "test_*.py" -v
          coverage report --show-missing --fail-under=80

  infraestrutura:
    name: Validar Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"

      - name: Verificar formatação
        run: terraform fmt -check -diff -recursive

      - name: Inicializar sem backend remoto
        run: terraform init -backend=false

      - name: Validar configuração
        run: terraform validate -no-color

  container:
    name: Build, teste, scan e entrega da imagem
    needs: [qualidade-testes-seguranca, infraestrutura]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem imutável
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            taskflow-api:ci
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}

      - name: Verificar vulnerabilidades críticas
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: taskflow-api:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Executar smoke test no container
        run: |
          docker run --detach --rm --name taskflow-ci --publish 8000:8000 taskflow-api:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs taskflow-ci
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/version
          curl --fail --silent --request POST http://127.0.0.1:8000/tasks \
            --header 'Content-Type: application/json' \
            --data '{"title":"Smoke test do pipeline"}'

      - name: Encerrar container de teste
        if: always()
        run: docker stop taskflow-ci 2>/dev/null || true

      - name: Autenticar no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem versionada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${GHCR_IMAGE}:${GITHUB_SHA}"
          docker tag "${GHCR_IMAGE}:${GITHUB_SHA}" "${GHCR_IMAGE}:latest"
          docker push "${GHCR_IMAGE}:latest"
          echo "### Imagem entregue" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${GHCR_IMAGE}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-aws:
    name: Entrega aprovada no AWS ECS
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_aws
    needs: [qualidade-testes-seguranca, infraestrutura, container]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'taskflow' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'taskflow-dev' }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE || 'taskflow-dev' }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY || 'taskflow-dev' }}
      ECS_CONTAINER: api
      ALB_NAME: ${{ vars.ALB_NAME || 'taskflow-dev-alb' }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Autenticar na AWS com OIDC
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Autenticar com credenciais temporárias do AWS Academy
        if: vars.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirmar identidade AWS
        run: aws sts get-caller-identity

      - name: Autenticar no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir e publicar no ECR
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build --build-arg "APP_VERSION=${GITHUB_SHA}" --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Obter definição de tarefa atual
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Inserir a imagem na definição de tarefa
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1.8.5
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER }}
          image: ${{ steps.image.outputs.uri }}
          environment-variables: |
            APP_ENV=production
            APP_VERSION=${{ github.sha }}
            LOG_LEVEL=INFO

      - name: Implantar no ECS e aguardar estabilidade
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      - name: Descobrir URL da aplicação
        id: application
        run: |
          URL="${{ vars.APPLICATION_URL }}"
          if [ -z "$URL" ]; then
            DNS_NAME="$(aws elbv2 describe-load-balancers \
              --names "$ALB_NAME" \
              --query 'LoadBalancers[0].DNSName' \
              --output text)"
            URL="http://${DNS_NAME}"
          fi
          echo "url=${URL%/}" >> "$GITHUB_OUTPUT"

      - name: Validar a versão implantada
        run: ./scripts/smoke-test.sh "${{ steps.application.outputs.url }}"

      - name: Registrar entrega
        run: |
          echo "### Entrega AWS concluída" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagem: \`${{ steps.image.outputs.uri }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.application.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
