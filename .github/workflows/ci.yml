name: Integração Contínua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade-e-testes:
    name: Qualidade e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ferramentas de qualidade
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verificar formatação e padrões
        run: ruff check app tests

      - name: Executar testes com cobertura
        run: |
          coverage run --source=app -m unittest discover -s tests -p "test_*.py" -v
          coverage report --show-missing --fail-under=80

  infraestrutura:
    name: Validar Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"

      - name: Verificar formatação
        run: terraform fmt -check -recursive

      - name: Inicializar sem backend remoto
        run: terraform init -backend=false

      - name: Validar configuração
        run: terraform validate -no-color

  imagem-docker:
    name: Construir imagem Docker
    needs: qualidade-e-testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: taskflow-api:ci
